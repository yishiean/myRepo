<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zen Home Hub · TV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Full-screen TV display: live wallpaper, clock, two notes, app dock. Built for a 1920x1080 LG webOS browser. */
:root{--display:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",Georgia,serif;--body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans",system-ui,sans-serif;color-scheme:dark}
html,body{margin:0;height:100%;background:#000;overflow:hidden;cursor:none}
body.pointer{cursor:default}
.stage{position:fixed;inset:0;overflow:hidden;background:#000;container-type:inline-size}
.stage canvas{position:absolute;inset:0;width:100%!important;height:100%!important;display:block}
.ov{position:absolute;inset:0;pointer-events:none;font-family:var(--body);transition:color .7s ease}
.ov.dark{color:#25282A}.ov.light{color:#F1ECE0}
.ov .clock{position:absolute;left:5cqw;top:5cqw;display:flex;flex-direction:column;gap:.3cqw}
.ov .clock b{font-family:var(--display);font-weight:500;font-size:6.2cqw;line-height:1;letter-spacing:.02em}
.ov .clock span{font-size:1.15cqw;letter-spacing:.16em;opacity:.75}
.notes{position:absolute;right:5cqw;top:5cqw;width:23cqw;display:flex;flex-direction:column;gap:1.6cqw}
.note{background:rgba(251,248,240,.92);color:#2A2C2A;padding:1.3cqw 1.6cqw;border-top:.35cqw solid var(--who);box-shadow:0 1cqw 2cqw -1.2cqw rgba(0,0,0,.45);transform:rotate(-1.2deg)}
.note:nth-child(2){transform:rotate(1deg)}
.note[hidden]{display:none!important}
.note small{display:block;font-size:.95cqw;letter-spacing:.08em;color:#7A7C74}
.note p{margin:.3cqw 0 0;font-family:var(--display);font-size:1.55cqw;line-height:1.45;overflow-wrap:anywhere}
.dock{position:absolute;left:50%;bottom:4.5cqw;transform:translateX(-50%);display:flex;gap:1.2cqw;pointer-events:auto}
.dock button{font:inherit;font-size:1.2cqw;letter-spacing:.06em;padding:.7cqw 1.9cqw;border-radius:999px;background:rgba(251,248,240,.7);color:#2A2C2A;border:1px solid rgba(42,44,42,.12);cursor:inherit}
.dock button.on{background:#2A2C2A;color:#FBF8F0}
.ov.light .dock button{background:rgba(20,22,24,.45);color:#F1ECE0;border-color:rgba(241,236,224,.2)}
.ov.light .dock button.on{background:#F1ECE0;color:#1B1D1F}
.dock button:focus-visible,.dock button:focus{outline:.25cqw solid #E8B04B;outline-offset:.3cqw}
.ov .tag{position:absolute;left:5cqw;bottom:5cqw;font-size:1.05cqw;letter-spacing:.18em;opacity:.75}
.toast{position:absolute;left:50%;bottom:10cqw;transform:translateX(-50%);background:rgba(20,22,24,.82);color:#F1ECE0;font-family:var(--body);font-size:1.3cqw;padding:1cqw 2cqw;border-radius:1cqw;opacity:0;pointer-events:none}
.hint{position:absolute;left:50%;top:2cqw;transform:translateX(-50%);font-family:var(--body);font-size:1cqw;letter-spacing:.12em;color:rgba(241,236,224,.85);background:rgba(20,22,24,.5);padding:.6cqw 1.4cqw;border-radius:999px}
.pin{position:absolute;inset:0;display:grid;place-items:center;background:rgba(10,12,16,.72);font-family:var(--body);color:#F1ECE0;text-align:center}
.pin[hidden]{display:none}
.pin h1{font-family:var(--display);font-weight:500;font-size:3cqw;margin:0 0 1cqw}
.pin p{font-size:1.3cqw;margin:0 0 2cqw;opacity:.8}
.dots{display:flex;gap:1.4cqw;justify-content:center}
.dots i{width:2.2cqw;height:2.2cqw;border-radius:50%;border:.2cqw solid #E8B04B}
.dots i.f{background:#E8B04B}
.pin .err{color:#FF9AA8;min-height:1.6cqw;margin-top:1.6cqw;font-size:1.2cqw}
.glfail{position:absolute;inset:0;display:grid;place-items:center;color:#ddd;font-family:var(--body);font-size:2cqw;padding:4cqw;text-align:center}
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="ov light" id="ov">
    <div class="clock"><b id="clk">--:--</b><span id="dte"></span></div>
    <div class="notes" id="notes">
      <div class="note" id="note-yishiean" style="--who:#E36A9A" hidden><small></small><p></p></div>

</div>

function wheelTexture(couple){
  var c=document.createElement('canvas');c.width=c.height=1024;var g=c.getContext('2d');

  g.shadowColor='rgba(255,190,80,0.95)';g.shadowBlur=14;

  g.strokeStyle=soft;g.lineWidth=1;[468,360,170].forEach(function(r){g.beginPath();g.arc(0,0,r,0,Math.PI*2);g.stroke();});
  couple.forEach(function(p){var a0=-(p.i*30)*Math.PI/180,a1=-(p.i*30+30)*Math.PI/180;
    g.fillStyle=p.fill;g.beginPath();g.arc(0,0,496,a1,a0);g.arc(0,0,440,a0,a1,true);g.closePath();g.fill();});

  G.fromTo('#ov .note:not([hidden])',{y:-50,opacity:0},{y:0,opacity:1,stagger:0.25,duration:1.6,ease:'elastic.out(1,0.55)',delay:0.8});
  G.fromTo('#ov .dock button',{y:26,opacity:0},{y:0,opacity:1,stagger:0.12,duration:0.9,ease:'back.out(2.2)',delay:1.1});
  G.fromTo('#ov .tag',{opacity:0,letterSpacing:'0.5em'},{opacity:0.75,letterSpacing:'0.18em',duration:1.6,ease:'power2.out',delay:1.3});
}
function select(i){
  if(i===current)return;
  var first=current<0;current=i;
  var swap=function(){
    if(active&&active.leave)active.leave();
    try{active=get(i);active.enter();}catch(e){console.error(e);}
    ov.className='ov '+WALLS[i].ov;document.getElementById('tag').textContent='SCENE · '+WALLS[i].tag;
    dockBtns.forEach(function(b){b.classList.toggle('on',b.dataset.app===APPS[WALLS[i].id]);});
    G.fromTo(canvasEl,{opacity:0},{opacity:1,duration:1.2,ease:'power2.out'});
    overlayIn();
  };
  if(first)swap();else G.to(canvasEl,{opacity:0,duration:0.5,ease:'power2.in',onComplete:swap});
}

var t0=performance.now(),last=0,prevT=null,startOffset=40;
function loop(now){
  requestAnimationFrame(loop);
  if(document.hidden){prevT=null;return;}
  if(now-last<33)return;
  last=now;
  var t=startOffset+(now-t0)/1000*(reduce?0.25:1);
  var dt=prevT===null?0.033:Math.min(0.1,t-prevT);prevT=t;
  if(active){try{active.render(t,dt);}catch(e){console.error(e);active=null;}}
}
/* ---------- notes: polled from the Home Hub backend, protected by the house PIN ---------- */
var CFG=window.ZEN_CONFIG||null,PIN_KEY='zen-house-pin',pin='',pinTyped='';
try{pin=localStorage.getItem(PIN_KEY)||'';}catch(e){}
var NAMES={yishiean:'YI SHIEAN',cheechung:'CHEE CHUNG'},shown={};
function noteTime(iso){
  var d=new Date(iso),now=new Date(),o=sgtParts(d),n=sgtParts(now);
  var same=o.day===n.day&&o.month===n.month;
  return same?o.hour+':'+o.minute:(o.weekday+' '+o.hour+':'+o.minute).toUpperCase();
}
function renderNotes(list){
  ['yishiean','cheechung'].forEach(function(who){
    var el=document.getElementById('note-'+who),n=null;
    list.forEach(function(x){if(x.author===who&&x.text&&x.text.trim())n=x;});
    var key=n?n.text+'|'+n.updated_at:'';
    if(key===shown[who])return;shown[who]=key;
    if(!n){G.to(el,{opacity:0,y:-20,duration:0.6,onComplete:function(){el.hidden=true;}});return;}
    el.querySelector('small').textContent='FROM '+NAMES[who]+' · '+noteTime(n.updated_at);
    el.querySelector('p').textContent=n.text;
    el.hidden=false;
    G.fromTo(el,{y:-60,rotation:who==='yishiean'?-9:8,opacity:0},{y:0,rotation:who==='yishiean'?-1.2:1,opacity:1,duration:1.6,ease:'elastic.out(1,0.55)'});
  });
}
function showPin(msg){pinTyped='';drawDots();document.getElementById('pinErr').textContent=msg||'';document.getElementById('pin').hidden=false;}
function drawDots(){[].forEach.call(document.querySelectorAll('#dots i'),function(d,k){d.className=k<pinTyped.length?'f':'';});}
function fetchNotes(){
  if(!CFG||!CFG.notesUrl)return;
  if(!pin){showPin();return;}
  fetch(CFG.notesUrl,{headers:{'x-house-pin':pin,'apikey':CFG.anonKey||'','Authorization':'Bearer '+(CFG.anonKey||'')}})
    .then(function(r){if(r.status===401){pin='';try{localStorage.removeItem(PIN_KEY);}catch(e){}showPin('That PIN did not work. Try again.');throw 0;}return r.json();})
    .then(function(j){document.getElementById('pin').hidden=true;renderNotes((j&&j.notes)||[]);})
    .catch(function(){});
}
fetchNotes();setInterval(fetchNotes,5000);

/* ---------- remote control ---------- */
function toast(msg){var t=document.getElementById('toast');t.textContent=msg;G.killTweensOf(t);G.fromTo(t,{opacity:0,y:10},{opacity:1,y:0,duration:0.4});G.to(t,{opacity:0,duration:0.6,delay:3.5});}
function goFull(){try{var el=document.documentElement,p=(el.requestFullscreen||el.webkitRequestFullscreen||function(){}).call(el);if(p&&p.catch)p.catch(function(){});}catch(e){}
  document.getElementById('hint').hidden=true;
  try{navigator.wakeLock&&navigator.wakeLock.request('screen').catch(function(){});}catch(e){}}
var dockBtns=[].slice.call(document.querySelectorAll('#dock button'));
function openApp(app){toast(app==='YouTube'?'Open YouTube from the Home button on your remote':'Press the '+app+' button on your remote');}
dockBtns.forEach(function(b){b.addEventListener('click',function(){openApp(b.dataset.app);});});
document.addEventListener('keydown',function(e){
  var k=e.keyCode;
  if(!document.getElementById('pin').hidden){
    var digit=k>=48&&k<=57?k-48:(k>=96&&k<=105?k-96:-1);
    if(digit>=0&&pinTyped.length<4){pinTyped+=digit;drawDots();}
    else if((k===8||k===461)&&pinTyped.length){pinTyped=pinTyped.slice(0,-1);drawDots();e.preventDefault();}
    else if(k===13&&pinTyped.length===4){pin=pinTyped;try{localStorage.setItem(PIN_KEY,pin);}catch(x){}document.getElementById('pin').hidden=true;goFull();fetchNotes();}
    return;
  }
  var i=dockBtns.indexOf(document.activeElement);
  if(k===37||k===39){e.preventDefault();var n=i<0?0:(i+(k===39?1:-1)+dockBtns.length)%dockBtns.length;dockBtns[n].focus();}
  else if(k===38||k===40){if(i>=0){document.activeElement.blur();e.preventDefault();}}
  else if(k===13){if(i<0){e.preventDefault();goFull();}}
});
document.addEventListener('click',function(e){if(!e.target.closest||!e.target.closest('#dock'))goFull();});
var mt;document.addEventListener('mousemove',function(){document.body.classList.add('pointer');clearTimeout(mt);mt=setTimeout(function(){document.body.classList.remove('pointer');},3000);});
if(!CFG||!CFG.notesUrl)toast('Notes are not connected yet. The wallpapers still work.');

/* ---------- scenes follow Singapore time ---------- */
var SCHEDULE=[[6,'asayake'],[12,'koi'],[18,'yozakura'],[21,'seiza']];
function scheduled(){var h=+sgtParts(new Date()).hour,id='seiza';SCHEDULE.forEach(function(s){if(h>=s[0])id=s[1];});
  var idx=0;WALLS.forEach(function(w,k){if(w.id===id)idx=k;});return idx;}
setInterval(function(){var k=scheduled();if(k!==current)select(k);},30000);
select(scheduled());
requestAnimationFrame(loop);
})();
</script>
